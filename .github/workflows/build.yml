name: Build Android APK
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Prebuild
        run: npx expo prebuild --clean --platform android
      - name: Fix build.gradle files
        run: |
          # Fix root build.gradle
          cd android
          
          # Remove problematic Kotlin plugin reference
          sed -i '/kotlin.plugin.compose/d' build.gradle || true
          
          # Set correct Kotlin version
          sed -i 's/ext.kotlinVersion = .*/ext.kotlinVersion = '\''1.9.0'\''/' build.gradle || echo "ext.kotlinVersion = '1.9.0'" >> build.gradle
          
          # Fix expo-dev-launcher build.gradle
          find . -name "build.gradle" -type f -exec sed -i '/kotlin.plugin.compose/d' {} \;
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
