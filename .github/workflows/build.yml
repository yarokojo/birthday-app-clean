name: Build Android APK
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Prebuild
        run: npx expo prebuild --clean --platform android
      - name: Fix build.gradle files
        run: |
          cd android
          # Check if files exist
          ls -la build.gradle || true
          
          # Create backup and fix using echo instead of sed
          echo "ext.kotlinVersion = '1.9.0'" >> build.gradle
          
          # Create local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Show what we have
          cat build.gradle | tail -20
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
