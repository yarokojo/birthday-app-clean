name: Build Android APK
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Prebuild
        run: npx expo prebuild --clean --platform android
      - name: Fix build.gradle files
        run: |
          cd android
          # Show current Kotlin version
          echo "=== Current build.gradle ==="
          cat build.gradle | grep -A2 -B2 kotlinVersion
          
          # Update Kotlin version
          sed -i 's/ext.kotlinVersion = .*/ext.kotlinVersion = "1.8.0"/' build.gradle || echo "ext.kotlinVersion = '1.8.0'" >> build.gradle
          
          echo "=== Updated Kotlin version ==="
          cat build.gradle | grep -A2 -B2 kotlinVersion
      - name: Build APK with full logging
        run: |
          cd android
          chmod +x gradlew
          # Run with full error details
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          # Show the last 100 lines of error
          echo "=== Last 100 lines of build log ==="
          tail -100 build.log
      - name: Check build output
        if: always()
        run: |
          cd android
          echo "=== Checking if APK was created ==="
          find . -name "*.apk" 2>/dev/null || echo "No APK found"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: android/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
